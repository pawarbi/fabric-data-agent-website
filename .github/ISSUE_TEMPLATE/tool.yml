name: Submit a Tool
description: Share a tool, library, or utility related to Fabric Data Agents.
title: "[Tool] "
labels: ["content-submission", "tool"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for sharing a tool with the community. Please fill out the fields below.

  - type: input
    id: title
    attributes:
      label: Tool Name
      description: The name of the tool or library.
      placeholder: "e.g. Semantic Link Labs"
    validations:
      required: true

  - type: input
    id: url
    attributes:
      label: Tool URL
      description: Link to the tool's homepage, repository, or documentation.
      placeholder: "https://github.com/example/tool"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What does this tool do and why is it useful? (2-3 sentences)
      placeholder: "This tool helps..."
    validations:
      required: true

  - type: dropdown
    id: category
    attributes:
      label: Category
      description: What type of tool is this?
      options:
        - library
        - utility
        - framework
        - testing
        - monitoring
        - other
    validations:
      required: true

  - type: input
    id: tags
    attributes:
      label: Tags
      description: Comma-separated tags for discoverability.
      placeholder: "python, testing, data-agent"
    validations:
      required: true

  - type: input
    id: contributor
    attributes:
      label: Your Name
      description: Your name as you'd like it to appear on the site.
      placeholder: "e.g. Jane Smith"
    validations:
      required: true
